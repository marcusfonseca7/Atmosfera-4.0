<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Atmosfera 4.0 - Teste da API</title>
</head>
<body>
<h1>Atmosfera 4.0 - Teste da API</h1>

<p>
  URL base da API (vazio = mesma origem, ex.: http://localhost:8080):
  <input id="base" size="30" placeholder="http://localhost:8080">
</p>

<h2>POST /api/inserir</h2>
<form id="form">
  <p><label>temperatura (float) <input name="temperatura" type="number" step="any" value="25.2" required></label></p>
  <p><label>umidade (float) <input name="umidade" type="number" step="any" value="60.5" required></label></p>
  <p><label>pressao (float) <input name="pressao" type="number" step="any" value="1013.2" required></label></p>
  <p><label>altitude (float) <input name="altitude" type="number" step="any" value="850" required></label></p>
  <p><label>luminosidade (float) <input name="luminosidade" type="number" step="any" value="720" required></label></p>
  <p><label>velocidadeVento (float) <input name="velocidadeVento" type="number" step="any" value="2.5" required></label></p>
  <p><label>direcaoVento (int) <input name="direcaoVento" type="number" step="1" value="90" required></label></p>
  <p><label>intensidadeWifi (int) <input name="intensidadeWifi" type="number" step="1" value="-45" required></label></p>
  <p><label>idDispositivoFk (int) <input name="idDispositivoFk" type="number" step="1" value="1" required></label></p>
  <button type="submit">Enviar (POST)</button>
</form>

<h3>JSON enviado</h3>
<pre id="enviado">-</pre>
<h3>Resposta do POST</h3>
<pre id="respostaPost">-</pre>

<hr>

<h2>GET /api/visualizar</h2>
<button id="listar" type="button">Listar registros (GET)</button>
<h3>Resposta (JSON bruto)</h3>
<pre id="respostaGet">-</pre>
<h3>Tabela</h3>
<div id="tabela"></div>

<script>
const INTEIROS = ["direcaoVento", "intensidadeWifi", "idDispositivoFk"];
const url = (p) => document.getElementById("base").value.replace(/\/$/, "") + p;

async function chamar(path, opcoes) {
  const r = await fetch(url(path), opcoes);
  const texto = await r.text();
  let corpo = texto;
  try { corpo = JSON.stringify(JSON.parse(texto), null, 2); } catch (e) {}
  return "HTTP " + r.status + " " + r.statusText + "\n" + corpo;
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const dados = {};
  for (const [k, v] of new FormData(e.target)) {
    dados[k] = INTEIROS.includes(k) ? parseInt(v, 10) : parseFloat(v);
  }
  document.getElementById("enviado").textContent = JSON.stringify(dados, null, 2);
  try {
    document.getElementById("respostaPost").textContent = await chamar("/api/inserir", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dados)
    });
  } catch (err) {
    document.getElementById("respostaPost").textContent = "Erro de rede: " + err;
  }
});

document.getElementById("listar").addEventListener("click", async () => {
  const pre = document.getElementById("respostaGet");
  const tab = document.getElementById("tabela");
  tab.innerHTML = "";
  try {
    const r = await fetch(url("/api/visualizar"));
    const texto = await r.text();
    let json;
    try { json = JSON.parse(texto); pre.textContent = "HTTP " + r.status + "\n" + JSON.stringify(json, null, 2); }
    catch (e) { pre.textContent = "HTTP " + r.status + "\n" + texto; return; }
    if (Array.isArray(json) && json.length) {
      const cols = Object.keys(json[0]);
      let h = "<table border='1' cellpadding='4'><tr>" + cols.map(c => "<th>" + c + "</th>").join("") + "</tr>";
      for (const l of json) h += "<tr>" + cols.map(c => "<td>" + (l[c] ?? "") + "</td>").join("") + "</tr>";
      tab.innerHTML = h + "</table>";
    }
  } catch (err) {
    pre.textContent = "Erro de rede: " + err;
  }
});
</script>
</body>
</html>
