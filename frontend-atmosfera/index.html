<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmosfera 4.0</title>

    <!-- FONTS -->
    <!-- Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"

    />

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="./src/assets/icons/favicon.png" />

    <!-- === HEADER MOBILE === -->
    <header>
      <a class="logo" href="./index.html">

      </a>

      <img id="img_header" src="/src/assets/icons/menu.png" />

    <!-- === SIDEBAR MOBILE === -->
    <div class="sidebar" id="sidebar">
      <a href="">
        <div class="sidebar-item">
          <img src="./src/assets/icons/home.png" alt="Início" />

        </div>
      </a>

      <a href="">
        <div class="sidebar-item">
          <img src="./src/assets/icons/simulation.png" alt="Simulação" />
          <p>Simulação</p>
        </div>
      </a>

      <a href="">
        <div class="sidebar-item">
          <img src="./src/assets/icons/us.png" alt="Sobre nós" />

        </div>

    <div class="sidebar-desktop">
      <a class="logotype" href="./index.html">
        <img src="./src/assets/images/favicon.png" alt="🌍" />

      </a>

      <div class="line"></div>

      <div class="nav-container">
        <a class="nav-item">
          <img src="./src/assets/icons/home.png" alt="Home" />
          <p>Dashboard</p>
        </a>

        <a class="nav-item">
          <img src="./src/assets/icons/simulation.png" alt="Simulação" />
          <p>Simulação</p>
        </a>

        <a class="nav-item">
          <img src="./src/assets/icons/us.png" alt="Sobre nós" />
          <p>Sobre Nós</p>
        </a>
      </div>

      <div class="connection-container">
        <img src="./src/assets/icons/wifi.png" alt="Wifi" />
        <h2>Campus conectado</h2>
        <p>Dispositivos conectados e online em tempo real.</p>
      </div>
    </div>

    <main>
      <section class="dashboard">
        <div class="campus-header">

        </div>

        <div class="campus-data">
          
        </div>

        <div class="devices-state">

        </div>
      </section>
    </main>

    <!-- === BOTTOM NAVBAR MOBILE === -->
    <nav class="navbar-bottom-mobile">
      <div class="navbar-bottom-mobile-container">
        <a href="">
          <div class="nav-item">
            <img src="./src/assets/icons/home.png" alt="Início" />
            <p>Dashboard</p>
          </div>
        </a>

        <a href="">
          <div class="nav-item">
            <img src="./src/assets/icons/simulation.png" alt="Simulação" />
            <p>Simulação</p>
          </div>
        </a>

        <a href="">
          <div class="nav-item">
            <img src="./src/assets/icons/us.png" alt="Sobre nós" />
            <p>Sobre nós</p>
          </div>
        </a>
      </div>

    <script type="module" src="./src/scripts/dom/sidebar.js"></script>
